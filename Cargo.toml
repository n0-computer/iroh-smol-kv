[package]
name = "iroh-smol-kv"
version = "0.4.0"
edition = "2024"
description = "A tiny replicated kv store that sync over an iroh-gossip topic"
license = "MIT OR Apache-2.0"
authors = ["rklaehn <rklaehn@protonmail.com>", "n0 team"]
repository = "https://github.com/n0-computer/iroh-smol-kv"
keywords = ["gossip", "kv", "p2p", "iroh"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bytes = { version = "1.12", features = ["serde"] }
ed25519-dalek = { version = "3", features = ["signature"] }
hex = "0.4.3"
iroh = { workspace = true }
iroh-gossip = { workspace = true }
irpc = { workspace = true }
n0-future = { workspace = true }
postcard = "1.1.3"
rand = "0.10"
rpds = { version = "1.2.1", features = ["serde"] }
serde = "1.0.229"
serde-big-array = "0.5.1"
tokio = "1.54"
tracing = "0.1"
sync_wrapper = "1"

chrono = { version = "0.4.45", optional = true }
peg = { version = "0.8.6", optional = true }
n0-error = { workspace = true }

[features]
filter-parser = ["dep:chrono", "dep:peg"]
default = ["filter-parser"]

[dev-dependencies]
clap = { version = "4.6.8", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
iroh-tickets = { workspace = true }
iroh = { workspace = true, features = ["tls-ring"] }
tokio = { version = "1.54", features = ["signal", "rt-multi-thread"] }

[workspace]
members = ["uniffi-example", "iroh-smol-kv-uniffi"]

[workspace.dependencies]
iroh = { version = "1.4", default-features = false }
iroh-gossip = "0.103.0"
iroh-tickets = "1"
irpc = { version = "1.0", default-features = false, features = ["derive", "rpc", "stream"] }
n0-future = "0.3.2"
n0-error = "1"
